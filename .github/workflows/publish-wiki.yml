name: Publish Wiki

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/wiki/**'
      - '.github/workflows/publish-wiki.yml'

permissions:
  contents: write

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Clone Wiki repository
        env:
          WIKI_AUTH_TOKEN: ${{ secrets.WIKI_TOKEN || github.token }}
        run: |
          git clone "https://x-access-token:${WIKI_AUTH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-repo

      - name: Copy Wiki pages
        run: |
          find docs/wiki -maxdepth 1 -type f -name '*.md' ! -name 'README.md' -print0 | while IFS= read -r -d '' file; do
            cp "$file" wiki-repo/
          done

      - name: Commit and push Wiki
        env:
          WIKI_AUTH_TOKEN: ${{ secrets.WIKI_TOKEN || github.token }}
        run: |
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi
          git commit -m "Sync Wiki from docs/wiki"
          git remote set-url origin "https://x-access-token:${WIKI_AUTH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          git push origin HEAD
