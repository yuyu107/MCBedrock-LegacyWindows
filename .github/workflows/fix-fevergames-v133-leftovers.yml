name: Fix FeverGames v1.3.3 Leftovers

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-fevergames-v133-leftovers.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fix leftovers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              '当前 FeverGames 下载器 v1.3.1 已在 Windows 7 SP1 x64 上验证 `1.18.42.14 / layout B`，可以完成《我的世界》基岩互通版完整下载，并继续启动、进入世界。':
              '当前 FeverGames 下载器 v1.3.3 已在 Windows 7 SP1 x64 上验证 `1.18.42.14 / layout B`，可以完成《我的世界》基岩互通版完整下载，并继续启动、进入世界。v1.3.3 同时包含 PowerShell 2.0 / 旧 CLR 验证修复与 Release CMD 编码 / 换行修复。',
              '当前正式版为 **v1.3.1**，已验证：':
              '当前正式版为 **v1.3.3**。v1.3.3 继承 v1.3.1 的 layout A/B 与自定义路径支持，并合入 v1.3.2 的 PowerShell 2.0 / 旧 CLR 验证修复，以及 v1.3.3 的 CMD 编码 / 换行修复。\n\n当前已验证：',
              'v1.3.1 已确认同一个 `1.18.42.14` 文件夹版本号可能对应不同的 `FeverGamesInstaller.exe` 二进制布局，因此不会只根据版本号盲目套用补丁，而是要求 5 个目标位置全部精确匹配。':
              'v1.3.3 继续沿用同版本多布局的精确匹配逻辑：同一个 `1.18.42.14` 文件夹版本号可能对应不同的 `FeverGamesInstaller.exe` 二进制布局，因此不会只根据版本号盲目套用补丁，而是要求 5 个目标位置全部精确匹配。',
          }
          for rel in ['README.md', 'docs/WIN7_CHINA_BEDROCK_VARIANTS.md']:
              p = Path(rel)
              text = p.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              text = text.replace('v1.3.1](https://github.com/yuyu107/FeverGames-LegacyWindows-Downloader/releases/tag/v1.3.1)', 'v1.3.3](https://github.com/yuyu107/FeverGames-LegacyWindows-Downloader/releases/tag/v1.3.3)')
              text = text.replace('Downloader v1.3.1', 'Downloader v1.3.3')
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-fevergames-v133-leftovers.yml
          git add README.md docs/WIN7_CHINA_BEDROCK_VARIANTS.md
          if git diff --cached --quiet; then
            echo "No leftovers found."
            exit 0
          fi
          git commit -m "docs: fix leftover FeverGames v1.3.1 references"
          git push
