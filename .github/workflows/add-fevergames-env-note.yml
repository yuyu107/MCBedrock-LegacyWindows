name: Add FeverGames Environment Notes

on:
  push:
    paths:
      - '.github/workflows/add-fevergames-env-note.yml'

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update FeverGames environment notes
        shell: python
        run: |
          from pathlib import Path

          def insert_once(path, marker, block):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              if block.strip() in text:
                  return False
              if marker not in text:
                  raise SystemExit(f'marker not found in {path}: {marker}')
              text = text.replace(marker, marker + block, 1)
              p.write_text(text, encoding='utf-8')
              return True

          readme_block = r'''
> [!IMPORTANT]
> 发烧游戏下载链补丁对 Win7 系统环境也有要求：如果系统是深度精简版，缺少 `powershell.exe` 或 .NET C# 编译器 `csc.exe`，下载器安装器无法正常运行。此类问题属于系统基础组件缺失，不是 Minecraft 本体运行兼容问题。

'''
          insert_once('README.md', '- **发烧游戏下载兼容：** [FeverGames Legacy Windows Downloader v1.3.3](https://github.com/yuyu107/FeverGames-LegacyWindows-Downloader/releases/tag/v1.3.3)\n', readme_block)

          win7_block = r'''
### 系统环境要求

FeverGames-LegacyWindows-Downloader 的安装器需要 Windows 7 中仍保留基础脚本和 .NET 组件，包括：

- `cmd.exe`：运行 `.cmd` 入口；
- `powershell.exe`：执行安装、状态检查、恢复和诊断脚本；
- .NET Framework 2.0 / 3.5 / 4.x 中至少一个可用的 C# 编译器 `csc.exe`；
- 管理员权限；
- 7-Zip 或 Windows 7 可用的 `zstd.exe`。

如果是深度精简版 Windows 7，缺少 PowerShell、.NET Framework / `csc.exe`、UAC、注册表或基础进程查询组件，可能无法完成安装。这种情况不等同于 FeverGames 补丁逻辑失败，也不等同于 `Minecraft.Windows.exe` 本体运行失败。

常见环境错误包括：

```text
'powershell.exe' 不是内部或外部命令，也不是可运行的程序或批处理文件。
No compatible .NET C# compiler was found (2.0/3.5/4.x).
```

遇到这类情况，建议先恢复 PowerShell / .NET Framework，或换用更完整的 Windows 7 SP1 x64 环境。

'''
          insert_once('docs/WIN7_CHINA_BEDROCK_VARIANTS.md', '### 发烧游戏平台下载链\n', win7_block)

          wiki_block = r'''
## 系统环境要求

FeverGames-LegacyWindows-Downloader 的安装器需要 Windows 7 中仍保留基础脚本和 .NET 组件：

- `cmd.exe`；
- `powershell.exe`；
- .NET Framework 2.0 / 3.5 / 4.x 中至少一个可用的 C# 编译器 `csc.exe`；
- 管理员权限；
- 7-Zip 或 Windows 7 可用的 `zstd.exe`。

如果使用深度精简版 Windows 7，缺少 PowerShell、.NET Framework / `csc.exe`、UAC、注册表或基础进程查询组件，可能无法运行安装、状态检查、恢复或诊断脚本。

常见表现：

```text
'powershell.exe' 不是内部或外部命令，也不是可运行的程序或批处理文件。
No compatible .NET C# compiler was found (2.0/3.5/4.x).
```

这类情况属于系统环境不完整，不是发烧游戏补丁逻辑失败，也不是 Minecraft 本体运行兼容失败。

'''
          insert_once('docs/wiki/FeverGames-Downloader.md', '## 它解决什么？\n', wiki_block)

          trouble_block = r'''
如果看到：

```text
'powershell.exe' 不是内部或外部命令，也不是可运行的程序或批处理文件。
```

说明系统中没有可用的 PowerShell，或 PowerShell 路径已被精简 / 破坏。当前下载器安装器无法继续运行。

如果看到：

```text
No compatible .NET C# compiler was found (2.0/3.5/4.x).
```

说明系统中没有找到可用的 .NET C# 编译器 `csc.exe`。请先恢复 / 安装 .NET Framework 组件，或换用更完整的 Windows 7 SP1 x64 环境。

'''
          insert_once('docs/wiki/Troubleshooting.md', '### 下载器安装阶段常见错误\n', trouble_block)

          faq_block = r'''
## 发烧游戏下载器对精简版 Windows 7 有要求吗？

有。FeverGames-LegacyWindows-Downloader 的安装、检查、恢复和诊断脚本需要 `cmd.exe`、`powershell.exe`、.NET Framework C# 编译器 `csc.exe`、管理员权限，以及 7-Zip 或可用的 `zstd.exe`。

如果系统是深度精简版，缺少 PowerShell、.NET Framework / `csc.exe`、UAC、注册表或基础进程查询组件，安装器可能无法运行。这属于系统环境不完整，不是 Minecraft 本体运行兼容问题。

'''
          p = Path('docs/wiki/FAQ.md')
          text = p.read_text(encoding='utf-8-sig')
          if faq_block.strip() not in text:
              text = text.rstrip() + '\n\n' + faq_block
              p.write_text(text, encoding='utf-8')

          Path('.github/workflows/add-fevergames-env-note.yml').unlink()
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: document FeverGames environment requirements" || exit 0
          git push
